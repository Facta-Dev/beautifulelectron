name: Propose a rule
description: Suggest a rule the skills should add, change, or drop
labels: ["rule"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill?
      options:
        - electron-best-practices (writing code)
        - electron-review (reviewing code)
        - electron-port (porting to Electron 45)
        - lints config
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule
      description: One or two sentences, phrased as guidance an agent could follow.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the published guidance this comes from (the Electron security documentation, the Electron process-model and packaging guides, the facta desktop handbook, the typescript-eslint rule docs, and so on).
    validations:
      required: true
  - type: textarea
    id: before
    attributes:
      label: What the agent writes today
      render: typescript
  - type: textarea
    id: after
    attributes:
      label: What it should write instead
      render: typescript
